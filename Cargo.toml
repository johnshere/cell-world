[package]
name = "cell-world"
version = "2.3.1"
edition = "2021"
default-run = "cell-world"
description = "Neural network emergence ecosystem simulator"
authors = ["Your Name"]

[dependencies]
# GUI
eframe = "0.29"
egui = "0.29"

# 随机数
rand = "0.8"

# 哈希
rustc-hash = "2.0"

# 并行计算
rayon = "1.10"

# 时间
chrono = "0.4"

# 正则
regex = "1"

# 压缩
flate2 = { version = "1.0", optional = true }

# 序列化
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = "1.0"
toml = { version = "0.8", optional = true }
toml_edit = { version = "0.22", optional = true }

# MCP / HTTP SSE 服务器
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time"] }
axum = "0.7"
futures = "0.3"

# GPU 计算（可选）
wgpu = { version = "22.1", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = ["persistence", "gpu"]
persistence = ["serde", "toml", "toml_edit", "flate2"]
gpu = ["wgpu", "bytemuck", "pollster"]

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "convert_snapshot"
path = "tools/convert_snapshot.rs"
