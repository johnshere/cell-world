[package]
name = "cell-world"
version = "2.1.0"
edition = "2021"
description = "Neural network emergence ecosystem simulator"
authors = ["Your Name"]

[dependencies]
# GUI
eframe = "0.29"
egui = "0.29"

# 随机数
rand = "0.8"

# 哈希
rustc-hash = "2.0"

# 并行计算
rayon = "1.10"

# 时间
chrono = "0.4"

# 序列化（可选，用于保存/加载）
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "0.8", optional = true }
toml_edit = { version = "0.22", optional = true }

# GPU 计算（可选）
wgpu = { version = "22.1", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = ["persistence", "gpu"]
persistence = ["serde", "serde_json", "toml", "toml_edit"]
gpu = ["wgpu", "bytemuck", "pollster"]

[profile.release]
opt-level = 3
lto = true
