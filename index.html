<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell World</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- 主画布区域 -->
        <div id="canvas-container">
            <canvas id="grid-canvas"></canvas>
            <!-- 坐标轴显示 -->
            <div id="coordinates-display">
                <span id="mouse-coords">坐标: (0, 0)</span>
                <span id="viewport-coords">视口: (0, 0)</span>
            </div>
        </div>
        
        <!-- 右侧面板 -->
        <div id="side-panel" class="panel-expanded">
            <div id="panel-toggle-btn" title="展开/收起面板">
                <span id="toggle-icon">◀</span>
            </div>
            <div id="panel-content">
                <h3>数据面板</h3>
                <div id="selected-data">
                    <p>当前未选中任何数据</p>
                </div>
                <div id="grid-info">
                    <h4>网格信息</h4>
                    <p>网格大小: <span id="grid-size">10px</span></p>
                    <p>视口位置: <span id="viewport-position">(0, 0)</span></p>
                    <p>缩放级别: <span id="zoom-level">100%</span></p>
                </div>
                <div id="controls">
                    <h4>控制面板</h4>
                    <button id="reset-view">重置视图</button>
                    <button id="center-origin">回到原点</button>
                    <div class="control-group">
                        <label for="grid-size-input">网格大小:</label>
                        <input type="range" id="grid-size-input" min="5" max="50" value="10">
                        <span id="grid-size-value">10</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="dist/app.js"></script>
</body>
</html>
