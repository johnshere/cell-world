# 初始模拟速度
initial_speed = 6.0
# 最小生物数量（低于此值自动补充）
min_creatures = 60
# 初始能量
initial_energy = 200.0
# 初始世界缩放比例
initial_scale = 0.4000000059604645

# === 火山 ===
# 火山坐标 X
volcano_x = 0.0
# 火山坐标 Y
volcano_y = 0.0
# 火山喷发间隔（秒）
volcano_interval = 6.0
# 火山喷射半径
volcano_radius = 1500.0
# 每次喷发粒子数
volcano_count = 50
# 火山粒子能量
volcano_particle_energy = 20.0

# === 陨石 ===
# 陨石降落间隔（秒）
meteorite_interval = 40.0
# 每颗陨石粒子数
meteorite_count = 20
# 陨石散布线段长度
meteorite_length = 400.0
# 陨石粒子能量
meteorite_particle_energy = 150.0

# === 正弦周期 ===
# 火山间隔正弦周期（秒）
volcano_interval_cycle = 700.0
# 火山间隔振幅比（0~0.9）
volcano_interval_amplitude = 0.6
# 火山能量正弦周期（秒）
volcano_energy_cycle = 300.0
# 火山能量振幅比（0~0.9）
volcano_energy_amplitude = 0.6
# 陨石间隔正弦周期（秒）
meteorite_interval_cycle = 400.0
# 陨石间隔振幅比（0~0.9）
meteorite_interval_amplitude = 0.7
# 陨石能量正弦周期（秒）
meteorite_energy_cycle = 250.0
# 陨石能量振幅比（0~0.9）
meteorite_energy_amplitude = 0.7

# 火山粒子衰减率（每秒）
volcano_decay_rate = 0.02
# 陨石粒子衰减率（每秒）
meteorite_decay_rate = 0.01

# === 落地杀伤 ===
# 火山落地杀伤半径
volcano_kill_radius = 15.0
# 陨石落地杀伤半径
meteorite_kill_radius = 40.0

# === 器官冷却 ===
# 眼睛冷却时间（秒）
eye_cooldown = 0.075
# 嘴巴冷却时间（秒）
mouth_cooldown = 1.0
# 咬合能量转移率
bite_transfer_rate = 0.8

# === 散热 ===
# 能量分母（nearby_energy 归一化）
energy_denominator = 800.0
# 散热下限（指数衰减底板）
heat_floor = 0.15

# === 代谢 ===
# 基础代谢率（每秒固定消耗）
base_metabolism = 0.035
# 年龄代谢倍率（age × 此值 = 额外倍率，年龄越大消耗越高）
age_metabolism_factor = 0.03
# 移动消耗（每单位距离）
move_cost = 0.0003
# === 体温 ===
# 体温逸散系数
heat_dissipation_coefficient = 0.01
# 喂食效率（固定比例）
feed_efficiency = 0.85


# === 感知 ===
# 视觉半径（眼睛能看到的最大距离）
vision_range = 150.0
# 接触判定距离
contact_range = 15.0

# === 进化 ===
# 变异率（所有变异逻辑共用）
mutation_rate = 0.15
# 初始连接数最小值
initial_connections_min = 6
# 初始连接数最大值
initial_connections_max = 12
# 种族相似度阈值（高于此值视为同一种族）
species_similarity_threshold = 0.9

# === 战力 ===
# 战力公式：速度权重（越快越强）
combat_speed_weight = 0.3
# 战力公式：同族援助权重（附近同族越多越强）
combat_ally_weight = 0.8

# 优势种检测：种群最老成员最低年龄
dominant_min_age = 350.0

# === 痕迹点 ===
# 痕迹点能量衰减率（/秒）
trail_decay_rate = 0.12
# 痕迹抑制半径（px，范围内有其他生物痕迹则不产生）
trail_suppress_radius = 10.0
# 痕迹生成间隔（秒，每个生物独立计时）
trail_emit_interval = 0.25

# === 繁殖 ===
# 繁殖冷却时间（秒）
reproduce_cooldown = 10.0

# === 算力能量 ===
# 算力转能量系数（内部除以1亿，0 = 禁用）
compute_energy_factor = 10.0

# === SNN ===
# 每帧 SNN tick 数（同步模式）
snn_ticks_per_frame = 10
# 神经后端: auto | cpu | gpu | legacy
neural_backend = "auto"
# 异步模式 tick 频率 (ticks/s)
neural_tick_rate = 600.0
