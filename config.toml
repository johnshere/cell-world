# 初始模拟速度
initial_speed = 10.0
# 最小生物数量（低于此值自动补充）
min_creatures = 5
# 最大生物数量（超过时禁止繁殖，0=不限制）
max_creatures = 999
# 初始能量
initial_energy = 100.0
# 初始世界缩放比例
initial_scale = 0.4000000059604645

# === 火山 ===
# 火山坐标 X
volcano_x = 0.0
# 火山坐标 Y
volcano_y = 0.0
# 火山喷发间隔（秒）
volcano_interval = 25.0
# 火山喷射半径
volcano_radius = 3000.0
# 火山粒子半径分布倾角（负值让外围更密，默认-0.3）
volcano_spread_bias = 1.0
# 每次喷发粒子数
volcano_count = 45
# 火山粒子能量
volcano_particle_energy = 130.0

# === 正弦周期 ===
# 火山间隔正弦周期（秒）
volcano_interval_cycle = 1700.0
# 火山间隔振幅比（0~0.9）
volcano_interval_amplitude = 0.1
# 火山能量正弦周期（秒）
volcano_energy_cycle = 1350.0
# 火山能量振幅比（0~0.9）
volcano_energy_amplitude = 0.1

# 火山粒子衰减率（每秒）
volcano_decay_rate = 0.001

# === 落地杀伤 ===
# 火山落地杀伤半径
volcano_kill_radius = 10.0
# 落地杀伤系数
landing_damage_multiplier = 0.1

# === 熔岩流 ===
# 每次火山喷发附带的熔岩流粒子数
lava_count = 0
# 熔岩粒子死亡时分裂第二个子粒子的概率
lava_spread_probability = 0.2
# 最大链式代数
lava_max_chain_depth = 1
# 每个粒子贡献的等效液面高度
lava_level_per_particle = 5.0
# 熔岩粒子周期性杀伤基础间隔（秒，火山口处）
lava_kill_base_interval = 0.7
# 距离对杀伤周期的放大系数
lava_kill_distance_scale = 4.5
# 熔岩粒子独立衰减率（/秒）
lava_decay_rate = 0.005
# 溢流最大区块跳跃数
lava_max_overflow_depth = 20

# === 器官冷却 ===
# 眼睛冷却时间（秒）— 已废弃
eye_cooldown = 0.075
# 眼睛扫描速度（度/秒）
eye_scan_speed = 280.0
# 嘴巴冷却时间（秒）
mouth_cooldown = 0.5
# 咬合能量转移率
bite_transfer_rate = 0.5

# === 散热 ===
# 能量分母（nearby_energy 归一化）
energy_denominator = 15.0
# 散热下限（指数衰减底板）
heat_floor = 0.03

# === 代谢 ===
# 年龄代谢倍率（age × 此值 = 额外倍率，年龄越大消耗越高）
age_metabolism_factor = 0.025
# 代谢指数（代谢 ∝ energy^此值，越大则大体型惩罚越重，1=线性）
metabolism_exponent = 2.0
# 移动消耗系数（面板值×0.00001×半径³ = 实际消耗）
move_cost = 1.0
# 跟随省力折扣（前方有同向生物时移动消耗最大减少比例）
follow_cost_discount = 0.99
# === 体温 ===
# 体温逸散系数
heat_dissipation_coefficient = 0.005
# 喂食效率（固定比例）
feed_efficiency = 0.85


# === 感知 ===
# 视觉半径（眼睛能看到的最大距离）
vision_range = 100.0
# 接触判定距离
contact_range = 15.0

# === 进化 ===
# 初始连接数最小值
initial_connections_min = 2
# 初始连接数最大值
initial_connections_max = 5
# 种族相似度阈值（高于此值视为同一种族）
species_similarity_threshold = 0.95

# === 战力 ===
# 战力公式：速度权重（越快越强）
combat_speed_weight = 2.0
# 战力公式：同族援助权重（附近同族越多越强）
combat_ally_weight = 0.3

# 优势种检测：种群最老成员最低年龄
dominant_min_age = 300.0

# === 痕迹点 ===
# 痕迹点能量衰减率（/秒）
trail_decay_rate = 0.01
# 痕迹抑制半径（px，范围内有痕迹则不产生）
trail_suppress_radius = 30.0
# 痕迹生成间隔（秒，每个生物独立计时）
trail_emit_interval = 0.4

# === 算力能量 ===
# 算力转能量系数（内部除以1亿，0 = 禁用）
compute_energy_factor = 100.0

# === SNN ===
# 每帧 SNN tick 数（同步模式）
snn_ticks_per_frame = 10
# 神经后端: auto | cpu | gpu | legacy
neural_backend = "auto"
# 异步模式 tick 频率 (ticks/s)
neural_tick_rate = 600.0
# 变异率（全局常量，不再是基因组内可演化基因）
# base/block 两类变异共享此触发概率
mutation_rate = 0.5
# 无性繁殖权重变异率缩放系数（仅作用于权重微调）
# 无性繁殖中其余 7 类创新变异（add_connection/add_node/Layer/Block/block_probs/learning/physio/enable切换）完全禁用
# 默认 0.4 ≈ 近似克隆；1.0=无差异化，0.0=完全克隆
asexual_mutation_scale = 0.2
base_metabolism = 0.025
max_speed = 20.0
meteorite_interval = 0.0
meteorite_count = 0
meteorite_length = 0.0
meteorite_particle_energy = 0.0
meteorite_decay_rate = 0.0
meteorite_interval_cycle = 0.0
meteorite_interval_amplitude = 0.0
meteorite_energy_cycle = 0.0
meteorite_energy_amplitude = 0.0
meteorite_kill_radius = 0.0
min_landing_damage_ratio = 0.0
stop_on_extinction = false
auto_spawn_interval = 99.0

# === 地形 ===
# 地形坡度移动消耗系数（上坡额外开销倍率，0=禁用）
terrain_slope_cost = 10.0
# === 奖励通道开关 ===
reward_energy_enabled = true
reward_trail_enabled = false
reward_group_enabled = false

# === 反孤立代价（统一系数）===
# 控制孤独生命的年龄加速倍率（vision_range 内无活邻居 → age 增速 ×solitude_penalty）
# 设为 1.0 则退化为无惩罚
# 注：繁殖年龄代价已统一为 +50，与有性/无性无关；本系数不再作用于繁殖
solitude_penalty = 100.0

reproduce_cooldown = 0.0
# 繁殖能量年龄代价系数（对称指数曲线 k）
# 父辈消耗 = energy × ratio × exp(+k·p)，后辈得到 = energy × ratio × exp(-k·p)
# p = age / maturation_time（发育度）；p=0 时无损耗，p>0 时损耗指数上升
# 与 structure_factor 形成姊妹曲线；0.0 退化为 100% 转移
reproduction_age_cost_rate = 0.4
follow_optimal_angle = 0.5235987755982988
follow_angle_width = 0.4363323129985824
follow_max_level = 1.0
follow_update_interval = 0.25
particle_min_energy = 50.0

# === 力导图 ===
# 力导图水平锚定强度（forceX strength，左右半球横向拉扯力）
force_graph_h_anchor = 0.08
# 力导图垂直锚定强度（forceY strength，感官/运动纵向拉扯力）
force_graph_v_anchor = 0.08
# 力导图单 iter 速度上限（cap）。原硬编码 = k×0.4 = 48，太小会把强锚定截断（v_anchor 增大无效）。
# 240 ≈ k×2.0，让 v_anchor 调到 2 时能压过边吸引（上限 50/iter）。
force_graph_max_vel = 240.0
# 力导图 Input/Output 间距（世界坐标）。同时作用于：
#   - 横向：同行内相邻 IO 节点等距间隔
#   - 纵向：IO 行与最近 Block 节点的安全距离（每帧贴近）
force_graph_io_spacing = 800.0
force_graph_density = 1.0
force_graph_cohesion_k = 0.3
