metabolism_exponent = 2.0
# 移动消耗系数（面板值×0.00001×半径³ = 实际消耗）
move_cost = 4.0
# 跟随省力折扣（前方有同向生物时移动消耗最大减少比例）
follow_cost_discount = 0.95
# === 体温 ===
# 体温逸散系数
