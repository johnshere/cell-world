# 初始模拟速度
initial_speed = 3.0
# 最小生物数量（低于此值自动补充）
min_creatures = 60
# 初始能量
initial_energy = 160.0
# 初始世界缩放比例
initial_scale = 0.6000000238418579

# === 火山 ===
# 火山坐标 X
volcano_x = 0.0
# 火山坐标 Y
volcano_y = 0.0
# 火山喷发间隔（秒）
volcano_interval = 60.0
# 火山喷射半径
volcano_radius = 900.0
# 每次喷发粒子数
volcano_count = 130
# 火山粒子能量
volcano_particle_energy = 80.0

# === 陨石 ===
# 陨石降落间隔（秒）
meteorite_interval = 40.0
# 每颗陨石粒子数
meteorite_count = 20
# 陨石散布线段长度
meteorite_length = 350.0
# 陨石粒子能量
meteorite_particle_energy = 120.0

# === 正弦周期 ===
# 火山间隔正弦周期（秒）
volcano_interval_cycle = 700.0
# 火山间隔振幅比（0~0.9）
volcano_interval_amplitude = 0.7
# 火山能量正弦周期（秒）
volcano_energy_cycle = 300.0
# 火山能量振幅比（0~0.9）
volcano_energy_amplitude = 0.5
# 陨石间隔正弦周期（秒）
meteorite_interval_cycle = 400.0
# 陨石间隔振幅比（0~0.9）
meteorite_interval_amplitude = 0.9
# 陨石能量正弦周期（秒）
meteorite_energy_cycle = 250.0
# 陨石能量振幅比（0~0.9）
meteorite_energy_amplitude = 0.9

# 火山粒子衰减率（每秒）
volcano_decay_rate = 0.035
# 陨石粒子衰减率（每秒）
meteorite_decay_rate = 0.01

# === 落地杀伤 ===
# 火山落地杀伤半径
volcano_kill_radius = 20.0
# 陨石落地杀伤半径
meteorite_kill_radius = 40.0

# === 器官冷却 ===
# 鼻子冷却时间（秒）
nose_cooldown = 0.4
# 眼睛冷却时间（秒）
eye_cooldown = 0.15
# 嘴巴冷却时间（秒）
mouth_cooldown = 1.0
# 鼻子单次扫描成本（每实体 × 此值，与环境密度正相关）
nose_scan_cost = 0.0003
# 眼睛单次扫描成本（每实体 × 此值，与环境密度正相关）
eye_scan_cost = 0.0002
# 咬合能量成本（|mouth| × mouth_power × 此值）
bite_cost = 0.5
# 咬合能量转移率
bite_transfer_rate = 0.15

# === 环境温度 ===
# 火山热辐射范围
volcano_heat_range = 1300.0
# 远离火山温度流失加成系数（+100%）
cold_loss_factor = 1.0
# 热容量系数（冷却上限 = 体型半径 × 此值，大体型更抗寒）
thermal_mass_factor = 12.0

# === 代谢 ===
# 基础代谢率（每秒固定消耗）
base_metabolism = 0.035
# 年龄代谢倍率（age × 此值 = 额外倍率，年龄越大消耗越高）
age_metabolism_factor = 0.03
# 移动消耗（每单位距离）
move_cost = 0.0003
# === 体温 ===
# 体温逸散系数（系数 × 冷却时长 × 周长 × 环境因子；小体积生物受影响更大，消耗/能量 ∝ energy^(-2/3)）
heat_dissipation_coefficient = 0.006
# 喂食效率（固定比例）
feed_efficiency = 0.85


# === 感知 ===
# 视觉半径（眼睛能看到的最大距离）
vision_range = 150.0
# 接触判定距离
contact_range = 15.0

# === 进化 ===
# 变异率（所有变异逻辑共用）
mutation_rate = 0.15
# 初始连接数最小值
initial_connections_min = 6
# 初始连接数最大值
initial_connections_max = 12
# 种族相似度阈值（高于此值视为同一种族）
species_similarity_threshold = 0.9

# === 战力 ===
# 战力公式：体温权重（越暖越强）
combat_temp_weight = 0.5
# 战力公式：速度权重（越快越强）
combat_speed_weight = 0.3
# 战力公式：同族援助权重（附近同族越多越强）
combat_ally_weight = 0.8
# 战力公式：同族援助范围
combat_ally_range = 50.0

# 优势种检测：种群最老成员最低年龄
dominant_min_age = 350.0

# === 痕迹点 ===
# 痕迹点能量衰减率（/秒）
trail_decay_rate = 0.12
# 痕迹抑制半径（px，范围内有其他生物痕迹则不产生）
trail_suppress_radius = 10.0
# 痕迹生成间隔（秒，每个生物独立计时）
trail_emit_interval = 0.25

# === 繁殖 ===
# 繁殖冷却时间（秒）
reproduce_cooldown = 10.0

# === 鼻子 ===
# 鼻子半角（弧度，PI/9 ≈ 20°）
nose_half_angle = 0.3490658503988659
